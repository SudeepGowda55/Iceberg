[profile.default]
src = "contracts"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200  # keeps IcebergRouter under the EIP-170 24,576-byte limit (24,236 bytes)
via_ir = true
evm_version = "cancun"
fs_permissions = [{ access = "read-write", path = "./research" }, { access = "read", path = "./deployments" }]
remappings = [
    "@1inch/swap-vm/=lib/swap-vm/contracts/",
    "@1inch/aqua/=lib/swap-vm/node_modules/@1inch/aqua/",
    "@1inch/solidity-utils/=lib/swap-vm/node_modules/@1inch/solidity-utils/",
    "@openzeppelin/contracts/=lib/swap-vm/node_modules/@openzeppelin/contracts/",
    "forge-std/=lib/swap-vm/node_modules/forge-std/src/",
    "uniswap-hooks/=lib/uniswap-hooks/",
    "@uniswap/v4-core/=lib/uniswap-hooks/lib/v4-core/",
    "@uniswap/v4-periphery/=lib/uniswap-hooks/lib/v4-periphery/",
]

[fuzz]
runs = 10000

[rpc_endpoints]
base = "${BASE_RPC_URL}"
